<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img"><title>从曲线到分类表</title><desc>合成信号经过分段、特征提取、分类和解释的过程记录。</desc><rect width="560" height="360" rx="14" fill="#f4f5f2"/><text x="28" y="34" fill="#26303a" font-family="Arial, sans-serif" font-size="16" font-weight="700">从曲线到分类表</text><text x="28" y="55" fill="#65707b" font-family="Arial, sans-serif" font-size="11">固定种子合成数据 · 教学预览 · v1.0</text><text x="28" y="91" fill="#59616e" font-family="Arial, sans-serif" font-size="10">原始曲线</text><line x1="28" y1="105" x2="160" y2="105" stroke="#d7ddd9" stroke-width="1"/><line x1="28" y1="129" x2="160" y2="129" stroke="#d7ddd9" stroke-width="1"/><line x1="28" y1="153" x2="160" y2="153" stroke="#d7ddd9" stroke-width="1"/><line x1="28" y1="177" x2="160" y2="177" stroke="#d7ddd9" stroke-width="1"/><line x1="28" y1="105" x2="28" y2="177" stroke="#d7ddd9" stroke-width="1"/><line x1="61" y1="105" x2="61" y2="177" stroke="#d7ddd9" stroke-width="1"/><line x1="94" y1="105" x2="94" y2="177" stroke="#d7ddd9" stroke-width="1"/><line x1="127" y1="105" x2="127" y2="177" stroke="#d7ddd9" stroke-width="1"/><line x1="160" y1="105" x2="160" y2="177" stroke="#d7ddd9" stroke-width="1"/><path d="M28.0,145.5 L35.8,133.7 L43.5,124.9 L51.3,121.3 L59.1,123.5 L66.8,136.7 L74.6,146.3 L82.4,155.3 L90.1,160.8 L97.9,160.9 L105.6,161.4 L113.4,151.2 L121.2,139.0 L128.9,128.0 L136.7,120.9 L144.5,125.6 L152.2,129.8 L160.0,138.1" fill="none" stroke="#355c7d" stroke-width="2"/><path d="M174 141 H205" stroke="#73777f" stroke-width="2"/><path d="M199 136 L205 141 L199 146" fill="none" stroke="#73777f" stroke-width="2"/><text x="218" y="91" fill="#59616e" font-family="Arial, sans-serif" font-size="10">分段与特征</text><rect x="218" y="105" width="132" height="72" rx="8" fill="#fffdf8" stroke="#d8d6cf"/><text x="232" y="129" fill="#171a1f" font-family="Arial, sans-serif" font-size="10">均值 0.48</text><text x="232" y="149" fill="#171a1f" font-family="Arial, sans-serif" font-size="10">波动 0.16</text><text x="232" y="169" fill="#b94f35" font-family="Arial, sans-serif" font-size="10">需复核：窗口长度</text><path d="M364 141 H395" stroke="#73777f" stroke-width="2"/><path d="M389 136 L395 141 L389 146" fill="none" stroke="#73777f" stroke-width="2"/><text x="408" y="91" fill="#59616e" font-family="Arial, sans-serif" font-size="10">分类与解释</text><rect x="408" y="105" width="124" height="72" rx="8" fill="#e6f0eb"/><text x="422" y="130" fill="#2e7d61" font-family="Arial, sans-serif" font-size="11" font-weight="700">类别 A</text><text x="422" y="151" fill="#171a1f" font-family="Arial, sans-serif" font-size="10">依据：均值 + 波动</text><text x="422" y="169" fill="#59616e" font-family="Arial, sans-serif" font-size="9">不是诊断结论</text><rect x="28" y="214" width="504" height="80" rx="10" fill="#fffdf8" stroke="#d8d6cf"/><text x="46" y="238" fill="#171a1f" font-family="Arial, sans-serif" font-size="11" font-weight="700">过程记录</text><text x="46" y="260" fill="#59616e" font-family="Arial, sans-serif" font-size="10">问题 → 输入 → 做法 → 结果 → 限制</text><text x="46" y="281" fill="#b94f35" font-family="Arial, sans-serif" font-size="10">卡住时：先保留曲线与特征表，不急着追求准确率</text></svg>