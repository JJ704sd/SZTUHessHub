<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">传感、采样与提示</title>
  <desc id="desc">传感器、采样模块、质量标记和提示状态通过箭头连接。</desc>
  <rect width="640" height="360" rx="24" fill="#edf9f6"/>
  <g font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <rect x="38" y="132" width="126" height="88" rx="16" fill="#fff" stroke="#a4dcd2" stroke-width="3"/><text x="101" y="174" fill="#14584f">传感</text><text x="101" y="198" fill="#5a746f" font-size="13">输入 / 单位</text>
    <rect x="206" y="132" width="126" height="88" rx="16" fill="#fff" stroke="#a4dcd2" stroke-width="3"/><text x="269" y="174" fill="#14584f">采样</text><text x="269" y="198" fill="#5a746f" font-size="13">时间 / 噪声</text>
    <rect x="374" y="132" width="126" height="88" rx="16" fill="#fff" stroke="#a4dcd2" stroke-width="3"/><text x="437" y="174" fill="#14584f">质量标记</text><text x="437" y="198" fill="#5a746f" font-size="13">正常 / 异常</text>
    <rect x="542" y="132" width="60" height="88" rx="16" fill="#0f766e"/><text x="572" y="174" fill="#fff">提示</text><text x="572" y="198" fill="#d8fff8" font-size="13">停止</text>
  </g>
  <g fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M166 176h28"/><path d="m184 164 14 12-14 12"/><path d="M334 176h28"/><path d="m352 164 14 12-14 12"/><path d="M502 176h28"/><path d="m520 164 14 12-14 12"/></g>
  <path d="M58 92h524" stroke="#86cfc3" stroke-dasharray="5 10" stroke-width="2"/>
  <text x="320" y="72" fill="#14584f" font-family="sans-serif" font-size="18" font-weight="700" text-anchor="middle">可观察的低风险闭环</text>
</svg>
