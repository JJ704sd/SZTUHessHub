name: HseeHub quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run env:check
      - run: npm run rollback:check
      - run: npm run check
      - name: Build preview artifact
        env:
          HSEEHUB_ENV: preview
          NEXT_PUBLIC_HSEEHUB_ENV: preview
          NEXT_PUBLIC_SITE_URL: https://preview.hseehub.invalid
        run: npm run build
      - name: Start preview server
        shell: bash
        env:
          HSEEHUB_ENV: preview
          NEXT_PUBLIC_HSEEHUB_ENV: preview
          NEXT_PUBLIC_SITE_URL: https://preview.hseehub.invalid
        run: |
          npm run start > .next/server.log 2>&1 &
          echo $! > .next/server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
      - name: Check preview metadata contract
        env:
          HSEEHUB_ENV: preview
          HSEEHUB_CHECK_ORIGIN: http://127.0.0.1:3000
        run: npm run metadata:check
      - name: Check preview runtime contract
        env:
          HSEEHUB_CHECK_ORIGIN: http://127.0.0.1:3000
        run: npm run runtime:check
      - run: npm run e2e:smoke
        env:
          BASE_URL: http://127.0.0.1:3000
      - run: npm run a11y:smoke
        env:
          BASE_URL: http://127.0.0.1:3000
      - run: npm run resources:probe
      - name: Install Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      - run: npm run test:e2e
        env:
          BASE_URL: http://127.0.0.1:3000
      - run: npm run test:a11y
        env:
          BASE_URL: http://127.0.0.1:3000
      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1.5-quality-artifacts
          path: |
            .next/server.log
            test-results/**
          if-no-files-found: ignore

  release-config:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run env:check
        env:
          HSEEHUB_ENV: production
          NEXT_PUBLIC_HSEEHUB_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          HSEEHUB_RELEASE_ID: ${{ vars.RELEASE_VERSION }}
      - run: npm run rollback:check
      - run: npm run release:check
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          RELEASE_VERSION: ${{ vars.RELEASE_VERSION }}
          ROLLBACK_VERSION: ${{ vars.ROLLBACK_VERSION }}
      - name: Build production candidate
        env:
          HSEEHUB_ENV: production
          NEXT_PUBLIC_HSEEHUB_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          HSEEHUB_RELEASE_ID: ${{ vars.RELEASE_VERSION }}
        run: npm run build
      - name: Start production candidate
        shell: bash
        env:
          HSEEHUB_ENV: production
          NEXT_PUBLIC_HSEEHUB_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          HSEEHUB_RELEASE_ID: ${{ vars.RELEASE_VERSION }}
        run: |
          npm run start > .next/production-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
      - name: Check production metadata contract
        env:
          HSEEHUB_ENV: production
          HSEEHUB_CHECK_ORIGIN: http://127.0.0.1:3000
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npm run metadata:check
